name: Security hardening 1.1.3

on:
  push:
    branches:
      - security/hardening-1.1.3
    paths:
      - tools/security_hardening.py
      - tools/security_hardening_extra.py
      - .github/workflows/security-hardening.yml

permissions:
  contents: write

jobs:
  harden-build-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@v6
        with:
          ref: security/hardening-1.1.3
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Apply audited hardening patch
        run: |
          python3 tools/security_hardening.py
          python3 tools/security_hardening_extra.py

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Test and build
        run: ./gradlew clean test shadowJar --no-daemon

      - name: Security regression checks
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find build/libs -maxdepth 1 -type f -name '*.jar' -print -quit)"
          test -n "$JAR"
          if jar tf "$JAR" | grep -q '^com/google/protobuf/'; then
            echo 'ERROR: unused protobuf classes are still bundled'
            exit 1
          fi
          if grep -R -F 'Bukkit.getOfflinePlayer(reportCase.getReportedName())' src/main/java; then
            echo 'ERROR: UUID-less name profile lookup still exists'
            exit 1
          fi
          grep -F 'sslMode=' src/main/java/com/slyph/cloverreports/database/DatabaseManager.java
          grep -F 'resolveConfinedPath' src/main/java/com/slyph/cloverreports/database/DatabaseManager.java
          grep -F 'SubmissionStatus.CAPACITY' src/main/java/com/slyph/cloverreports/gui/submission/ReportSubmissionListener.java

      - name: Commit verified hardening changes
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'security: harden CloverReports 1.1.3'
          git push origin HEAD:security/hardening-1.1.3

      - name: Upload verified plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: CloverReports-1.1.3-security
          path: build/libs/*.jar
          if-no-files-found: error
