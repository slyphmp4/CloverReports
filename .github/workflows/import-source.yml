name: Import source bundle

on:
  push:
    paths:
      - '.import/019.b64'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Reconstruct source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .import/*.b64 > /tmp/cloverreports.b64
          base64 --decode /tmp/cloverreports.b64 > /tmp/cloverreports.zip
          rm -rf /tmp/cloverreports-src
          mkdir -p /tmp/cloverreports-src
          unzip -q /tmp/cloverreports.zip -d /tmp/cloverreports-src
          test -f /tmp/cloverreports-src/CloverReports/build.gradle
          test -f /tmp/cloverreports-src/CloverReports/gradle/wrapper/gradle-wrapper.jar

      - name: Import project into repository root
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete --exclude='.git/' /tmp/cloverreports-src/CloverReports/ ./
          chmod +x gradlew
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: import CloverReports 26.2 source'
          git push
