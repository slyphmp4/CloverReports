name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout released tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '25'
          check-latest: false
          cache: gradle
          cache-dependency-path: |
            build.gradle
            settings.gradle
            gradle.properties
            gradle/verification-metadata.xml
            gradle/wrapper/gradle-wrapper.properties

      - name: Verify Gradle wrapper JAR
        shell: bash
        run: echo '497c8c2a7e5031f6aa847f88104aa80a93532ec32ee17bdb8d1d2f67a194a9c7  gradle/wrapper/gradle-wrapper.jar' | sha256sum --check --strict

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Test, build, compare JAR with sources and hash it
        run: ./gradlew clean test writeArtifactChecksum --no-daemon --dependency-verification strict

      - name: Stage release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-bundle
          path: |
            build/libs/*.jar
            build/checksums/SHA256SUMS
            build/reports/jar-content-manifest.sha256
          if-no-files-found: error
          retention-days: 7

  attest-and-publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Download verified release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-bundle
          path: dist

      - name: Attest JAR build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/libs/*.jar

      - name: Publish JAR, checksums and content manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload '${{ github.event.release.tag_name }}' --repo '${{ github.repository }}' dist/libs/*.jar dist/checksums/SHA256SUMS dist/reports/jar-content-manifest.sha256
