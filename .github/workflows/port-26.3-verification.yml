name: Paper 26.3 dependency verification bootstrap

on:
  push:
    branches: [port/minecraft-26.3]

permissions:
  contents: read

jobs:
  verify-port:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Java 25
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '25'
          check-latest: false
      - name: Verify Gradle wrapper JAR
        shell: bash
        run: echo '7a9ce74cff467ca1bf60a4fcd9f05185acceda4d0f382434d393e17864262c5d  gradle/wrapper/gradle-wrapper.jar' | sha256sum --check --strict
      - name: Bootstrap verification metadata from pinned dependencies
        run: |
          chmod +x gradlew
          ./gradlew clean build --write-verification-metadata sha256 --no-daemon --warning-mode all
      - name: Print generated dependency verification metadata
        if: always()
        run: |
          echo 'BEGIN_26_3_VERIFICATION_XML'
          cat gradle/verification-metadata.xml
          echo 'END_26_3_VERIFICATION_XML'
      - name: Verify build with strict dependency checks
        run: ./gradlew clean build --no-daemon --dependency-verification strict --warning-mode all
