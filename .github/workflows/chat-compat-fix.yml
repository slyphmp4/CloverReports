name: Apply Cardboard chat compatibility fix

on:
  push:
    paths:
      - '.github/workflows/chat-compat-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Patch chat input listeners
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          gui = Path('src/main/java/com/slyph/cloverreports/gui/GUIListener.java')
          s = gui.read_text()
          s = s.replace(
              'import io.papermc.paper.event.player.AsyncChatEvent;\nimport org.bukkit.event.player.PlayerInteractEvent;',
              'import io.papermc.paper.event.player.AsyncChatEvent;\nimport org.bukkit.event.player.AsyncPlayerChatEvent;\nimport org.bukkit.event.player.PlayerInteractEvent;'
          )
          old = '''    @EventHandler(priority = EventPriority.HIGHEST, ignoreCancelled = true)
              public void onPlayerChat(AsyncChatEvent event) {
                  UUID playerId = event.getPlayer().getUniqueId();
                  if (!ChatInputRegistry.isOwnedBy(playerId, NOTE_INPUT_OWNER)) {
                      return;
                  }
                  PendingNoteInput input = pendingNoteInputs.get(playerId);
                  if (input == null) {
                      ChatInputRegistry.release(playerId, NOTE_INPUT_OWNER);
                      return;
                  }
                  event.setCancelled(true);
                  if (!pendingNoteInputs.remove(playerId, input)) {
                      return;
                  }
                  ChatInputRegistry.release(playerId, NOTE_INPUT_OWNER);
                  String message = PlainTextComponentSerializer.plainText().serialize(event.message()).trim();
                  OperationSession operation = new OperationSession(input.lease);
                  OperationSession existing = activeOperations.putIfAbsent(playerId, operation);
                  if (existing != null) {
                      runMain(() -> {
                          cancelNoteInputTimeout(playerId);
                          Player player = Bukkit.getPlayer(playerId);
                          if (player != null) {
                              send(player, "action-error", "&cНе удалось выполнить действие.", Map.of());
                          }
                          if (!matches(existing, input.lease)) {
                              releaseLeaseAsync(input.lease, true);
                          }
                      });
                      return;
                  }
                  runMain(() -> beginNoteProcessing(playerId, input, operation, message));
              }
          '''
          new = '''    @EventHandler(priority = EventPriority.HIGHEST, ignoreCancelled = true)
              public void onPlayerChat(AsyncChatEvent event) {
                  String message = PlainTextComponentSerializer.plainText().serialize(event.message()).trim();
                  if (captureNoteChat(event.getPlayer(), message)) {
                      event.setCancelled(true);
                  }
              }

              @SuppressWarnings("deprecation")
              @EventHandler(priority = EventPriority.HIGHEST, ignoreCancelled = true)
              public void onLegacyPlayerChat(AsyncPlayerChatEvent event) {
                  // Cardboard 26.x dispatches the Bukkit legacy chat event instead of
                  // Paper's AsyncChatEvent. Keep this fallback Cardboard-only so Paper
                  // continues to use the modern component chat API without double handling.
                  if (!"Cardboard".equalsIgnoreCase(Bukkit.getServer().getName())) {
                      return;
                  }
                  if (captureNoteChat(event.getPlayer(), event.getMessage().trim())) {
                      event.setCancelled(true);
                  }
              }

              private boolean captureNoteChat(Player player, String message) {
                  UUID playerId = player.getUniqueId();
                  if (!ChatInputRegistry.isOwnedBy(playerId, NOTE_INPUT_OWNER)) {
                      return false;
                  }
                  PendingNoteInput input = pendingNoteInputs.get(playerId);
                  if (input == null) {
                      ChatInputRegistry.release(playerId, NOTE_INPUT_OWNER);
                      return false;
                  }
                  if (!pendingNoteInputs.remove(playerId, input)) {
                      return false;
                  }
                  ChatInputRegistry.release(playerId, NOTE_INPUT_OWNER);
                  OperationSession operation = new OperationSession(input.lease);
                  OperationSession existing = activeOperations.putIfAbsent(playerId, operation);
                  if (existing != null) {
                      runMain(() -> {
                          cancelNoteInputTimeout(playerId);
                          Player online = Bukkit.getPlayer(playerId);
                          if (online != null) {
                              send(online, "action-error", "&cНе удалось выполнить действие.", Map.of());
                          }
                          if (!matches(existing, input.lease)) {
                              releaseLeaseAsync(input.lease, true);
                          }
                      });
                      return true;
                  }
                  runMain(() -> beginNoteProcessing(playerId, input, operation, message));
                  return true;
              }
          '''
          if old not in s:
              raise SystemExit('GUIListener chat handler block not found')
          gui.write_text(s.replace(old, new))

          submission = Path('src/main/java/com/slyph/cloverreports/gui/submission/ReportSubmissionListener.java')
          s = submission.read_text()
          s = s.replace(
              'import io.papermc.paper.event.player.AsyncChatEvent;\nimport org.bukkit.event.player.PlayerInteractEvent;',
              'import io.papermc.paper.event.player.AsyncChatEvent;\nimport org.bukkit.event.player.AsyncPlayerChatEvent;\nimport org.bukkit.event.player.PlayerInteractEvent;'
          )
          old = '''    @EventHandler(priority = EventPriority.HIGHEST, ignoreCancelled = true)
              public void onPlayerChat(AsyncChatEvent event) {
                  PendingEvidenceInput input = pendingEvidenceInputs.get(event.getPlayer().getUniqueId());
                  if (input == null || !ChatInputRegistry.isOwnedBy(event.getPlayer().getUniqueId(), CHAT_INPUT_OWNER)) {
                      return;
                  }
                  event.setCancelled(true);
                  UUID playerUuid = event.getPlayer().getUniqueId();
                  String message = PlainTextComponentSerializer.plainText().serialize(event.message()).trim();
                  Bukkit.getScheduler().runTask(plugin, () -> handleEvidenceChat(playerUuid, input, message));
              }
          '''
          new = '''    @EventHandler(priority = EventPriority.HIGHEST, ignoreCancelled = true)
              public void onPlayerChat(AsyncChatEvent event) {
                  String message = PlainTextComponentSerializer.plainText().serialize(event.message()).trim();
                  if (captureEvidenceChat(event.getPlayer(), message)) {
                      event.setCancelled(true);
                  }
              }

              @SuppressWarnings("deprecation")
              @EventHandler(priority = EventPriority.HIGHEST, ignoreCancelled = true)
              public void onLegacyPlayerChat(AsyncPlayerChatEvent event) {
                  // Cardboard 26.x dispatches AsyncPlayerChatEvent for player chat.
                  // Paper keeps using AsyncChatEvent above.
                  if (!"Cardboard".equalsIgnoreCase(Bukkit.getServer().getName())) {
                      return;
                  }
                  if (captureEvidenceChat(event.getPlayer(), event.getMessage().trim())) {
                      event.setCancelled(true);
                  }
              }

              private boolean captureEvidenceChat(Player player, String message) {
                  UUID playerUuid = player.getUniqueId();
                  PendingEvidenceInput input = pendingEvidenceInputs.get(playerUuid);
                  if (input == null || !ChatInputRegistry.isOwnedBy(playerUuid, CHAT_INPUT_OWNER)) {
                      return false;
                  }
                  Bukkit.getScheduler().runTask(plugin, () -> handleEvidenceChat(playerUuid, input, message));
                  return true;
              }
          '''
          if old not in s:
              raise SystemExit('ReportSubmissionListener chat handler block not found')
          submission.write_text(s.replace(old, new))

          build = Path('build.gradle')
          s = build.read_text()
          if "version = '1.1.0'" not in s:
              raise SystemExit('Expected 1.1.0 version not found')
          build.write_text(s.replace("version = '1.1.0'", "version = '1.1.1'", 1))
          PY

      - name: Commit fix
        shell: bash
        run: |
          rm .github/workflows/chat-compat-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: restore Cardboard chat input capture"
          git push
